<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn from Music</title>
    <meta
      name="description"
      content="Turn song lyrics into flashcards, a quiz, a written test, and a spaced-repetition study plan."
    />
    <!--
      Fonts moved out of the component's inline <style>. An @import inside
      injected CSS can't be discovered by the preload scanner, so it blocks
      render; a <link> here starts the download immediately.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
