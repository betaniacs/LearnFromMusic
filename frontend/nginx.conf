server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page app fallback: the bundle owns routing, so any path that isn't
    # a real file must still return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api is handed to the backend container. The hostname
    # `backend` is resolved by Docker's built-in DNS to the compose service of
    # that name — no IP addresses, no links.
    #
    # Because the browser only ever talks to this one origin, the session
    # cookie is same-origin and no CORS configuration is needed anywhere.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Lets express-rate-limit see the real client IP instead of nginx's.
        # Paired with TRUST_PROXY=1 on the backend service.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Building a deck with adaptive thinking can take well over a minute.
        # nginx's default 60s read timeout would sever the request mid-answer
        # and surface as a 504 in the UI.
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }

    # Vite fingerprints asset filenames (index-Ub9qglOS.js), so a given URL's
    # contents can never change — cache it hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file whose URL is stable while its contents change.
    # Caching it would pin visitors to a stale bundle after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
